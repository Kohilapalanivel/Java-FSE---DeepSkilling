<h2>Student Enrollment Request</h2>

<form #enrollForm="ngForm"
      (ngSubmit)="onSubmit(enrollForm)">

  <!-- Student Name -->
  <div>

    <label>Student Name</label><br>

    <input
      type="text"
      name="studentName"
      required
      minlength="3"
      [(ngModel)]="studentName"
      #nameCtrl="ngModel">

    <br>

    <span
      *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']"
      style="color:red">

      Name is required

    </span>

    <span
      *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']"
      style="color:red">

      Name must be at least 3 characters

    </span>

  </div>

  <br>

  <!-- Email -->

  <div>

    <label>Email</label><br>

    <input
      type="email"
      name="studentEmail"
      required
      email
      [(ngModel)]="studentEmail"
      #emailCtrl="ngModel">

    <br>

    <span
      *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']"
      style="color:red">

      Email is required

    </span>

    <span
      *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']"
      style="color:red">

      Enter a valid email

    </span>

  </div>

  <br>

  <!-- Course ID -->

  <div>

    <label>Course ID</label><br>

    <input
      type="number"
      name="courseId"
      required
      [(ngModel)]="courseId"
      #courseCtrl="ngModel">

    <br>

    <span
      *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']"
      style="color:red">

      Course ID is required

    </span>

  </div>

  <br>

  <!-- Semester -->

  <div>

    <label>Preferred Semester</label><br>

    <select
      name="preferredSemester"
      [(ngModel)]="preferredSemester"
      required
      #semesterCtrl="ngModel">

      <option value="">Select Semester</option>
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>

    </select>

  </div>

  <br>

  <!-- Agree -->

  <div>

    <input
      type="checkbox"
      name="agreeToTerms"
      required
      [(ngModel)]="agreeToTerms"
      #agreeCtrl="ngModel">

    I Agree to Terms & Conditions

    <br>

    <span
      *ngIf="agreeCtrl.touched && agreeCtrl.errors?.['required']"
      style="color:red">

      You must agree to continue

    </span>

  </div>

  <br>

  <!-- Buttons -->

  <button
    type="submit"
    [disabled]="enrollForm.invalid">

    Submit

  </button>

  <button
    type="button"
    (click)="enrollForm.resetForm()">

    Reset

  </button>

</form>

<br>

<div
  *ngIf="submitted"
  style="color:green;font-weight:bold;">

  Enrollment request submitted successfully!

</div>
