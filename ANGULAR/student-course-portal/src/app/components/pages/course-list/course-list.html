<h2>Available Courses</h2>


<div class="course-container">


    <div class="course-card"
         *ngFor="let course of courses"
         (click)="viewCourse(course.id)">


        <h3>{{course.name}}</h3>

        <p>
            Duration: {{course.duration}}
        </p>

        <p>
            {{course.description}}
        </p>


    </div>


</div>
